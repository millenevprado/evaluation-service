# ============================================
# WORKFLOW: CI - evaluation-service
# Build & Unit Test (compila o código e roda os testes)
# ============================================
name: 🔄 CI - evaluation-service

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ============================================
  # JOB: Build & Unit Test
  # ============================================
  build-test:
    name: 🏗️ Build & Unit Test
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout do código
      - name: 📥 Checkout
        uses: actions/checkout@v4

      # Step 2: Configurar Go
      - name: 🐹 Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Step 3: Baixar dependências
      - name: 📦 Download dependencies
        run: go mod download

      # Step 4: Compilar o código
      - name: 🏗️ Build
        run: go build -v ./...

      # Step 5: Rodar testes unitários (se houver)
      - name: 🧪 Run unit tests
        run: go test -v ./...
